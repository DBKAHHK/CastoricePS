name: Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: '选择构建目标'
        required: true
        default: 'all'
        type: choice
        options:
          - windows
          - android-arm64
          - android-armv7
          - all
      create_release:
        description: '创建Release并上传产物'
        required: true
        default: false
        type: boolean
      version:
        description: '版本号 (当创建Release时使用)'
        required: false
        default: '1.6.1'
      release_notes:
        description: '更新说明 (Release描述)'
        required: false
        default: '解压运行，使用代理，安卓貌似需要root权限运行，安卓代理地址https://github.com/Xuoos/AnimeGamesProxy/releases/download/4.1/AnimeGamesProxy-release_4.1.apk'

env:
  ZIG_VERSION: 0.14.1

jobs:
  build-windows:
    if: |
      github.event.inputs.build_target == 'windows' || 
      github.event.inputs.build_target == 'all'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig (Windows)
        shell: pwsh
        run: |
          $ZIG_URL = "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip"
          $ZIP_PATH = "$env:RUNNER_TEMP\zig.zip"
          $EXTRACT_PATH = "$env:RUNNER_TEMP\zig"

          Write-Host "Downloading Zig from $ZIG_URL"
          Invoke-WebRequest -Uri $ZIG_URL -OutFile $ZIP_PATH

          Expand-Archive -Path $ZIP_PATH -DestinationPath $EXTRACT_PATH -Force
          
          $ZIG_DIR = Get-ChildItem -Path $EXTRACT_PATH -Directory | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Found Zig directory: $ZIG_DIR"
          
          echo "$ZIG_DIR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          & "$ZIG_DIR\zig.exe" version

      - name: 临时修复 build.zig (Windows)
        shell: pwsh
        run: |
          # 检查并修复 artifact 名称
          if (Select-String -Path "build.zig" -Pattern "castoriceps") {
            Write-Host "找到需要修复的 'castoriceps'，正在替换为 'CastoricePS'..."
            (Get-Content "build.zig") -replace "castoriceps", "CastoricePS" | Set-Content "build.zig"
            Write-Host "修复完成"
          } else {
            Write-Host "未找到需要修复的文本"
          }

      - name: 提前复制资源文件到输出目录 (Windows)
        shell: pwsh
        run: |
          # 创建输出目录（如果不存在）
          New-Item -ItemType Directory -Path zig-out/bin -Force
          # 仅复制指定的资源文件和文件夹，避免混入无关内容
          Copy-Item -Path launcher, protocol, resources, freesr-data.json, hotfix.json, misc.json -Destination zig-out/bin/ -Recurse

      - name: Build Windows
        shell: pwsh
        run: |
          Write-Host "执行: zig build -Doptimize=ReleaseSafe"
          zig build -Doptimize=ReleaseSafe

      - name: 上传 Windows 构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CastoricePS-win
          path: zig-out/bin/

      - name: 打包 Windows 构建产物
        shell: pwsh
        run: |
          Push-Location zig-out/bin
          Compress-Archive -Path * -DestinationPath ${{ github.workspace }}\CastoricePS-win.zip -Force
          Pop-Location

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: success() && github.event.inputs.create_release == 'true'
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          files: CastoricePS-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android-arm64:
    if: |
      github.event.inputs.build_target == 'android-arm64' || 
      github.event.inputs.build_target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig (Linux)
        run: |
          wget -q "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz"
          tar -xf "zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz"
          
          ZIG_DIR=$(find $(pwd) -maxdepth 1 -type d -name "zig-*" | head -n1)
          echo "Found Zig directory: $ZIG_DIR"
          
          echo "$ZIG_DIR" >> $GITHUB_PATH
          $ZIG_DIR/zig version

      - name: 临时修复 build.zig (Linux)
        run: |
          # 检查并修复 artifact 名称
          if grep -q "castoriceps" build.zig; then
            echo "找到需要修复的 'castoriceps'，正在替换为 'CastoricePS'..."
            sed -i 's/castoriceps/CastoricePS/g' build.zig
            echo "修复完成"
          else
            echo "未找到需要修复的文本"
          fi

      - name: 提前复制资源文件到输出目录 (Linux)
        run: |
          # 创建输出目录（如果不存在）
          mkdir -p zig-out/bin
          # 仅复制指定的资源文件和文件夹，避免混入无关内容
          cp -r protocol resources freesr-data.json hotfix.json misc.json zig-out/bin/

      - name: Build Android ARM64
        run: |
          echo "执行: zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseSafe"
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseSafe

      - name: 上传 Android ARM64 构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CastoricePS-android-arm64
          path: zig-out/bin/

      - name: 打包 Android ARM64 构建产物
        run: |
          (cd zig-out/bin/ && zip -r ${{ github.workspace }}/CastoricePS-android-arm64.zip *)

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: success() && github.event.inputs.create_release == 'true'
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          files: CastoricePS-android-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android-armv7:
    if: |
      github.event.inputs.build_target == 'android-armv7' || 
      github.event.inputs.build_target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig (Linux)
        run: |
          wget -q "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz"
          tar -xf "zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz"
          
          ZIG_DIR=$(find $(pwd) -maxdepth 1 -type d -name "zig-*" | head -n1)
          echo "Found Zig directory: $ZIG_DIR"
          
          echo "$ZIG_DIR" >> $GITHUB_PATH
          $ZIG_DIR/zig version

      - name: 临时修复 build.zig (Linux)
        run: |
          # 检查并修复 artifact 名称
          if grep -q "castoriceps" build.zig; then
            echo "找到需要修复的 'castoriceps'，正在替换为 'CastoricePS'..."
            sed -i 's/castoriceps/CastoricePS/g' build.zig
            echo "修复完成"
          else
            echo "未找到需要修复的文本"
          fi

      - name: 修复 ARMv7 类型不匹配问题
        run: |
          echo "查找所有包含 readToEndAlloc 的文件并添加 @intCast"
          # 使用更精确的正则表达式匹配
          find . -name "*.zig" -type f -exec grep -l "readToEndAlloc(allocator, [a-zA-Z0-9_]*)" {} \; | while read file; do
            echo "处理文件: $file"
            # 替换模式：readToEndAlloc(allocator, variable) -> readToEndAlloc(allocator, @intCast(variable))
            sed -i 's/\(readToEndAlloc(allocator, \)\([a-zA-Z0-9_]\+\))/\1@intCast(\2))/g' "$file"
          done
          echo "所有文件处理完成"
          echo "验证修改结果："
          find . -name "*.zig" -type f -exec grep -l "@intCast" {} \; | while read file; do
            echo "已修改文件: $file"
          done

      - name: 提前复制资源文件到输出目录 (Linux)
        run: |
          mkdir -p zig-out/bin
          cp -r protocol resources freesr-data.json hotfix.json misc.json zig-out/bin/

      - name: Build Android ARMv7
        run: |
          echo "执行: zig build -Dtarget=arm-linux-androideabi -Doptimize=ReleaseSafe"
          zig build -Dtarget=arm-linux-androideabi -Doptimize=ReleaseSafe

      - name: 上传 Android ARMv7 构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CastoricePS-android-armv7
          path: zig-out/bin/

      - name: 打包 Android ARMv7 构建产物
        run: |
          (cd zig-out/bin/ && zip -r ${{ github.workspace }}/CastoricePS-android-armv7.zip *)

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: success() && github.event.inputs.create_release == 'true'
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          files: CastoricePS-android-armv7.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
